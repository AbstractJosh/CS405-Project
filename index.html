<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS405 Project 1 — Kavunlu Natürmort</title>
<style>
  :root { color-scheme: dark; --bg: #141311; --panel: #1c1b19; --ink: #ece8e1; --ink2: #a8a197; --line: #34312c; --accent: #e0703c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
  body { display: flex; }
  main { position: relative; flex: 1; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  #hud { position: absolute; left: 10px; top: 8px; padding: 4px 8px; border-radius: 4px; background: rgba(0, 0, 0, .6);
         font: 12px ui-monospace, Consolas, monospace; white-space: pre; pointer-events: none; }
  #err:empty { display: none; }
  #err { position: absolute; inset: 0; display: grid; place-items: center; padding: 40px; font-size: 16px; text-align: center; background: var(--bg); }
  aside { width: 440px; height: 100vh; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 2px 14px 40px; }
  h2 { font-size: 14px; margin: 18px 0 6px; color: var(--accent); }
  .hint { color: var(--ink2); margin: 0 0 6px; }
  label.row { display: grid; grid-template-columns: 110px 1fr 48px; gap: 8px; align-items: center; margin: 3px 0; }
  label.row select { grid-column: 2 / 4; }
  label.chk { display: block; margin: 3px 0; }
  input[type=range], input[type=checkbox] { accent-color: var(--accent); }
  input[type=range] { width: 100%; }
  output { font: 12px ui-monospace, Consolas, monospace; text-align: right; }
  select, button { font: inherit; color: var(--ink); background: #2a2825; border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  button { cursor: pointer; padding: 4px 10px; }
  button:hover { border-color: var(--accent); }
  pre { font: 11px/1.35 ui-monospace, Consolas, monospace; background: #0e0d0c; padding: 8px 10px; border-radius: 6px; overflow-x: auto; margin: 8px 0 0; max-height: 460px; }
</style>
</head>
<body>
  <main>
    <canvas id="gpu"></canvas>
    <div id="hud"></div>
    <div id="err"></div>
  </main>
  <aside id="panel"></aside>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
